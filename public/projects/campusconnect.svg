<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e21" />
      <stop offset="100%" stop-color="#141a3b" />
    </linearGradient>
    <linearGradient id="cBrandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#cBgGrad)" />

  <!-- Frame -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#0d142d" stroke="#233261" stroke-width="1.5" filter="url(#shadow4)" />

  <!-- Header -->
  <rect x="20" y="20" width="760" height="46" rx="12" fill="#131c3e" />
  <circle cx="44" cy="43" r="5" fill="#ef4444" />
  <circle cx="62" cy="43" r="5" fill="#f59e0b" />
  <circle cx="80" cy="43" r="5" fill="#10b981" />
  <text x="110" y="48" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CampusConnect — Espace Étudiants &amp; Communauté</text>
  <rect x="620" y="32" width="135" height="22" rx="11" fill="url(#cBrandGrad)" />
  <text x="635" y="47" fill="#fff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ Connecté en L3 SIL</text>

  <!-- Welcome banner -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="710" height="85" rx="10" fill="url(#cBrandGrad)" opacity="0.18" stroke="#4f46e5" stroke-width="1" />
    <text x="25" y="28" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">VOTRE CAMPUS EN UN CLIC</text>
    <text x="25" y="55" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">Bienvenue dans l'annuaire interactif des étudiants</text>
    <text x="25" y="73" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Développé avec React.js, Vite et composants modernes réactifs.</text>
    <rect x="560" y="25" width="125" height="34" rx="8" fill="url(#cBrandGrad)" />
    <text x="580" y="47" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">↻ Actualiser</text>
  </g>

  <!-- Students List Cards -->
  <g transform="translate(45, 180)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="345" height="66" rx="8" fill="#141d40" stroke="#263668" stroke-width="1" />
    <circle cx="36" cy="33" r="18" fill="#8b5cf6" />
    <text x="27" y="38" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">KG</text>
    <text x="68" y="28" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">KORA Gawarou</text>
    <text x="68" y="48" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">Génie Informatique (L3 SIL)</text>
    <rect x="290" y="22" width="40" height="22" rx="4" fill="#8b5cf6" opacity="0.2" />
    <text x="300" y="37" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">#01</text>

    <!-- Card 2 -->
    <rect x="365" y="0" width="345" height="66" rx="8" fill="#141d40" stroke="#263668" stroke-width="1" />
    <circle cx="401" cy="33" r="18" fill="#3b82f6" />
    <text x="392" y="38" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">OK</text>
    <text x="433" y="28" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">OROU Kassim</text>
    <text x="433" y="48" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">Systèmes &amp; Réseaux</text>
    <rect x="655" y="22" width="40" height="22" rx="4" fill="#3b82f6" opacity="0.2" />
    <text x="665" y="37" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">#02</text>

    <!-- Card 3 -->
    <rect x="0" y="76" width="345" height="66" rx="8" fill="#141d40" stroke="#263668" stroke-width="1" />
    <circle cx="36" cy="109" r="18" fill="#f97316" />
    <text x="27" y="114" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">FN</text>
    <text x="68" y="104" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Fatou Ndiaye</text>
    <text x="68" y="124" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11">Développement Web Full-Stack</text>
    <rect x="290" y="98" width="40" height="22" rx="4" fill="#f97316" opacity="0.2" />
    <text x="300" y="113" fill="#fb923c" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">#03</text>

    <!-- Card 4 -->
    <rect x="365" y="76" width="345" height="66" rx="8" fill="#141d40" stroke="#263668" stroke-width="1" />
    <circle cx="401" cy="109" r="18" fill="#10b981" />
    <text x="394" y="114" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">IK</text>
    <text x="433" y="104" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Ibrahim Koné</text>
    <text x="433" y="124" fill="#86efac" font-family="system-ui, sans-serif" font-size="11">Génie Informatique</text>
    <rect x="655" y="98" width="40" height="22" rx="4" fill="#10b981" opacity="0.2" />
    <text x="665" y="113" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">#04</text>

    <!-- Card 5 (Aminata) -->
    <rect x="0" y="152" width="710" height="60" rx="8" fill="#141d40" stroke="#263668" stroke-width="1" />
    <circle cx="36" cy="182" r="16" fill="#ec4899" />
    <text x="28" y="186" fill="#fff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">AA</text>
    <text x="68" y="177" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Aminata ALIOU &bull; Data &amp; Intelligence Artificielle</text>
    <text x="68" y="195" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Étudiante active sur la plateforme &bull; Inscription validée</text>
    <text x="600" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Voir profil ↗</text>
  </g>
</svg>